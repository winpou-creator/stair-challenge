<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>QR 생성 - 계단오르기 챌린지</title>
<link rel="stylesheet" href="style.css">
<style>body{padding-bottom:20px} main{margin-top:0;padding-top:16px} #qr{display:flex;justify-content:center;padding:16px;background:#fff;border-radius:12px}</style>
</head>
<body>
<header><h1>🔑 입장 QR 만들기</h1><p>관리자 전용 · 출력해서 계단 입구에 부착하세요</p></header>
<main>
  <div class="card">
    <label for="site">사이트 주소</label>
    <input id="site" placeholder="https://xxxx.netlify.app/">
    <label for="key">입장키 (Apps Script 속성 ENTRY_KEY와 동일)</label>
    <input id="key" placeholder="예: stair-2026-x7k2">
    <button id="btn">QR 만들기</button>
    <div class="msg">입장키는 이 페이지에 저장되지 않습니다. 생성된 QR 안에만 들어갑니다.</div>
  </div>
  <div class="card hidden" id="out">
    <div id="qr"></div>
    <div class="msg" id="urlTxt" style="word-break:break-all"></div>
    <button id="dl" class="ghost">PNG로 저장</button>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
$('site').value = location.href.replace(/qr\.html.*$/, ''); // GitHub Pages처럼 /저장소명/ 하위 경로여도 동작
$('btn').onclick = () => {
  const site = $('site').value.trim(), key = $('key').value.trim();
  if (!site || !key) return alert('사이트 주소와 입장키를 입력해 주세요.');
  const url = site.replace(/[?#].*$/, '') + '?k=' + encodeURIComponent(key);
  $('qr').textContent = '';
  new QRCode($('qr'), { text: url, width: 280, height: 280, correctLevel: QRCode.CorrectLevel.M });
  $('urlTxt').textContent = url;
  $('out').classList.remove('hidden');
};
$('dl').onclick = () => {
  const c = $('qr').querySelector('canvas');
  const a = document.createElement('a');
  a.href = c ? c.toDataURL('image/png') : $('qr').querySelector('img').src;
  a.download = 'stair-entry-qr.png'; a.click();
};
</script>
</body>
</html>
